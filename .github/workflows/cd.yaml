---
name: 02 Azure Landing Zones Continuous Delivery
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'
      terraform_cli_version:
        description: 'Terraform CLI Version'
        required: true
        default: '1.14.9'
        type: string
      terraform_target:
        description: 'Optional -target=... flags (space separated), e.g. -target=azurerm_resource_group.policysweep_identity -target=azurerm_user_assigned_identity.policysweep'
        required: false
        default: ''
        type: string
      import_resources:
        description: 'One-time state reconciliation: skips the plan refresh (avoids the known slow/unrelated-resource full-refresh issue) so only terraform_target/import blocks are evaluated'
        required: false
        default: false
        type: boolean

jobs:
  plan_and_apply:
    uses: My-Personal-GH-Org/alz-mgmt-templates/.github/workflows/cd-template.yaml@main
    name: 'CD'
    permissions:
      id-token: write
      contents: read
    with:
      terraform_action: ${{ inputs.terraform_action }}
      root_module_folder_relative_path: '.'
      terraform_cli_version: ${{ inputs.terraform_cli_version }}
      terraform_target: ${{ inputs.terraform_target }}
      import_resources: ${{ inputs.import_resources }}
      # PolicySweep root-of-hierarchy fix needs the id the alz provider itself treats as
      # root_management_group_id (data.alz_architecture.this), i.e. the MG that
      # azapi_resource.policy_assignments/policy_role_assignments are actually created under -
      # confirmed via Sandbox state that this is 'alz', not the externally-referenced parent MG
      # below. Live-tested 2026-10-18: zero policy_assignment/policy_role_assignment resources
      # exist anywhere under MG-AzLz-Acclrtr in Sandbox state, so the detection step could never
      # have fired with that value - it only ever matches resources actually created under 'alz'.
      # root_management_group_id: 'MG-AzLz-Acclrtr'  # Accelerator-set root_parent_management_group_id (external anchor MG 'alz' nests under) - NOT the policy hierarchy root, kept here for reference only
      root_management_group_id: 'alz'