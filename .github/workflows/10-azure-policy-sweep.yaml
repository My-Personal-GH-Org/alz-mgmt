name: "10 [SCHEDULED] Policy Compliance Remediation Sweep"

on:
  # schedule:
  #   - cron: "0 18 * * *"   # nightly - always runs with TargetScope=All - DISABLED for now, see memory note
  workflow_dispatch:
    inputs:
      root_management_group_id:
        description: "Root management group ID to sweep"
        required: true
        default: "MG-AzLz-Acclrtr"
      target_scope:
        description: "Which scopes to process"
        required: true
        type: choice
        default: "All"
        options:
          - "All"
          - "RootOnly"
          - "ChildrenOnly"  # child MGs only, skip the root MG
      dry_run:
        description: "WhatIf - report only, make no changes"
        required: true
        type: boolean
        default: true
      fix_do_not_enforce_policies:
        description: "Also remediate assignments in DoNotEnforce mode (default: skip them)"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  remediate:
    runs-on: self-hosted   # match whatever your plan/apply jobs already use
    environment: alz-mgmt-policy-sweep   # separate, no-approval environment - see FIC note below
    env:
      # Must be set before azure/login imports the Az module (enable-AzPSSession: true below) to take effect.
      SuppressAzurePowerShellBreakingChangeWarnings: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Az Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Run remediation sweep
        shell: pwsh
        # workflow_dispatch inputs are empty on schedule-triggered runs, hence the fallback defaults below.
        run: |
          $params = @{
            RootManagementGroupId = '${{ github.event.inputs.root_management_group_id || 'MG-AzLz-Acclrtr' }}'
            TargetScope            = '${{ github.event.inputs.target_scope || 'All' }}'
          }
          if ('${{ github.event.inputs.dry_run || 'true' }}' -eq 'true') {
            $params.WhatIf = $true
          }
          if ('${{ github.event.inputs.fix_do_not_enforce_policies || 'false' }}' -eq 'true') {
            $params.FixDoNotEnforcePolicies = $true
          }
          ./Scripts/Invoke-PolicyRemediationSweep.ps1 @params
